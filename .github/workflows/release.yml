name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          # Bot PAT with access to Workflows: the built-in GITHUB_TOKEN can't
          # trigger other workflows on the tag it pushes.
          token: ${{ secrets.GH_PAT }}

  # Reformats the changelog to Craft's style and reattributes the release commit to
  # github-actions[bot] — release-please-action commits it as the GH_PAT owner
  # (iwf-web-bot), so without this the release commit is authored by the bot account.
  fix-changelog:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    env:
      # release-please's branch name varies by config; read it from the PR object
      # rather than hardcoding release-please--branches--main.
      PR_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: Checkout release-please branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ env.PR_BRANCH }}
          fetch-depth: 2

      - name: Configure git as github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Transform changelog to Craft CMS format
        run: |
          # Transform date format: (YYYY-MM-DD) -> - YYYY-MM-DD
          sed -i -E 's/\) \(([0-9]{4}-[0-9]{2}-[0-9]{2})\)$/) - \1/g' CHANGELOG.md

      - name: Amend release commit with changelog fix
        run: |
          set -euo pipefail
          # --reset-author rewrites author + committer to the bot; --no-edit keeps the
          # message. Amend unconditionally so the author is reset even when the
          # changelog transform is a no-op. Stage any changelog change first.
          git add CHANGELOG.md
          git commit --amend --reset-author --no-edit
          git push origin "$PR_BRANCH" --force-with-lease
